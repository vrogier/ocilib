title: OCILIB (C and C++ Driver for Oracle) - Open source C and C++ library for accessing Oracle databases 
email: ocilib.library@gmail.com

description: OCILIB is an open source and cross platform Oracle Driver that delivers efficient access to Oracle databases. It offers a full featured, easy and productive API. Written in ISO C and C++ on top of OCI, OCILIB runs on all Oracle platforms.

baseurl: ""
url: https://ocilib.net

projecturl: https://github.com/vrogier/ocilib
meurl: https://github.com/vrogier/

# Logo lives in the topbar (left, next to the menu) — no separate banner.
# A page can still opt into a banner via `header: yes` + `header_img:`.
header: no
header_img: images/ocilib-logo-with-text-details-small.png

exclude: [.bundle, bin, vendor, Gemfile, Gemfile.lock, Rakefile, s3_website.yml, .last_optimized, .vs, node_modules]
 
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'

destination: _site


google_universal_analytics: UA-64388697-1
google_universal_analytics_cookiedomain: auto

twitter_user: ocilib
twitter_card: true
# Card/share image for og:image and twitter:image — site-root-relative path.
# Any page can override it via `image:` front matter.
social_image: /images/ocilib-logo-with-text-details.png

ocilib_current_release_version: 4.9.0
ocilib_current_release_date: 2026-05-19
ocilib_author: Vincent Rogier
